<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Màn Hình Giám Sát Trật Tự Lớp Học</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
    body { background: #0f172a; margin: 0; padding: 20px; color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; }
    .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.4); text-align: center; }
    h1 { font-size: 22px; margin: 0 0 6px; color: #38bdf8; }
    .wifi-badge { display: inline-block; padding: 6px 14px; border-radius: 99px; font-size: 13px; font-weight: 700; background: #7f1d1d; color: #fca5a5; margin-bottom: 14px; }
    .wifi-badge.online { background: #064e3b; color: #6ee7b7; }
    
    .status-box { padding: 20px; border-radius: 12px; font-size: 24px; font-weight: 800; margin: 14px 0; transition: 0.3s; }
    .NORMAL { background: #064e3b; color: #6ee7b7; border: 2px solid #10b981; }
    .WARN1  { background: #78350f; color: #fcd34d; border: 2px solid #f59e0b; }
    .WARN2  { background: #7f1d1d; color: #fca5a5; border: 2px solid #ef4444; }

    .stat-row { display: flex; justify-content: space-around; margin: 16px 0; font-size: 16px; }
    .stat-val { font-size: 28px; font-weight: 900; color: #38bdf8; }
    
    button { width: 100%; padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-voice { background: #2563eb; color: white; }
    .btn-voice.active { background: #16a34a; }
    .btn-reset { background: #475569; color: #f1f5f9; font-size: 13px; padding: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>🏫 GIÁM SÁT TRẬT TỰ LỚP HỌC AI</h1>
      <div id="wifiBadge" class="wifi-badge">🔴 Robot đang Offline</div>

      <div id="statusBox" class="status-box NORMAL">ĐANG CHỜ DỮ LIỆU...</div>

      <div class="stat-row">
        <div>Độ ồn thực tế<div id="dbVal" class="stat-val">-- dB</div></div>
        <div>Số lần vi phạm<div id="violVal" class="stat-val" style="color:#f87171;">0</div></div>
      </div>

      <button id="voiceBtn" class="btn-voice" onclick="toggleVoice()">🔊 Đang bật giọng nói nhắc từ xa</button>
      <button class="btn-reset" onclick="resetCounter()">🔄 Đặt lại bộ đếm tiết học</button>
    </div>
  </div>

  <script>
    let lastSpokenState = '';

    async function toggleVoice() {
      const res = await fetch('/api/toggle-voice', { method: 'POST' });
      const data = await res.json();
      updateVoiceBtn(data.voice_enabled);
    }

    function updateVoiceBtn(enabled) {
      const btn = document.getElementById('voiceBtn');
      if (enabled) {
        btn.textContent = "🔊 Đang bật giọng nói nhắc từ xa";
        btn.classList.add('active');
      } else {
        btn.textContent = "🔇 Đã tắt giọng nói nhắc từ xa";
        btn.classList.remove('active');
      }
    }

    function speakVietnamese(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'vi-VN';
      utter.rate = 1.05;
      window.speechSynthesis.speak(utter);
    }

    async function resetCounter() {
      await fetch('/api/reset', { method: 'POST' });
    }

    // Cập nhật trạng thái liên tục từ Server mỗi 0.5 giây
    setInterval(async () => {
      try {
        const res = await fetch('/api/status');
        const data = await res.json();

        const badge = document.getElementById('wifiBadge');
        if (data.online) {
          badge.textContent = "🟢 Robot AI Online";
          badge.classList.add('online');
        } else {
          badge.textContent = "🔴 Robot đang Offline";
          badge.classList.remove('online');
          return;
        }

        document.getElementById('dbVal').textContent = data.db + " dB";
        document.getElementById('violVal').textContent = data.violations;
        updateVoiceBtn(data.voice_enabled);

        const box = document.getElementById('statusBox');
        box.className = "status-box " + data.state;

        if (data.state === "WARN2") {
          box.textContent = "CẢNH BÁO: LỚP QUÁ ỒN!";
          if (data.voice_enabled && lastSpokenState !== "WARN2") {
            speakVietnamese("Cảnh báo, lớp đang quá ồn, đề nghị các bạn giữ trật tự!");
          }
        } else if (data.state === "WARN1") {
          box.textContent = "NHẮC NHỞ: GIỮ TRẬT TỰ";
          if (data.voice_enabled && lastSpokenState !== "WARN1") {
            speakVietnamese("Các bạn ơi, lớp mình giữ trật tự nhé!");
          }
        } else {
          box.textContent = "LỚP HỌC YÊN TĨNH";
        }
        lastSpokenState = data.state;

      } catch (e) {}
    }, 500);
  </script>
</body>
</html>
